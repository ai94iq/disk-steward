name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        shell: cmd
        run: test.bat --no-pause

  release:
    # A v* tag builds the MSI and attaches it to a GitHub release (unsigned).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Package
        shell: cmd
        run: package.bat --no-pause
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/installer/**/*.msi
